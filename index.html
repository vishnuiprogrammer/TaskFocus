<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskFocus - Trello Mini</title>
    <!-- Fonts and Icons -->
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="workspace">
      <!-- Header -->
      <header
        class="navbar-top d-flex justify-content-between align-items-center mb-4"
      >
        <div class="app-branding">
          <i class="bi bi-layers-half me-2"></i> TaskFocus
        </div>

        <div class="search-container">
          <i class="bi bi-search"></i>
          <input type="text" id="taskSearchInput" placeholder="Search tasks." />
        </div>

        <div class="toolbar-actions d-flex gap-3">
          <select
            id="taskPriorityFilter"
            class="form-select border-0 shadow-sm"
          >
            <option value="All">All Priorities</option>
            <option value="High">High Priority</option>
            <option value="Medium">Medium Priority</option>
            <option value="Low">Low Priority</option>
          </select>
          <button class="btn btn-primary-custom" onclick="showTaskModal()">
            + New Task
          </button>
        </div>
      </header>

      <div class="dashboard-header mb-4">
        <h1>Task Dashboard</h1>
        <p class="text-muted">Manage and track your progress</p>
      </div>

      <!-- Kanban Board -->
      <div class="board-container">
        <!-- To Do -->
        <div
          class="column-section"
          id="todoColumn"
          ondragover="allowDrop(event)"
          ondrop="dropTask(event)"
        >
          <div class="column-title">
            <span class="status-indicator blue"></span> To Do
            <span class="task-counter" id="todoTaskCount">0</span>
          </div>
          <div class="tasks-wrapper" id="todoTasksContainer"></div>
          <div class="empty-state" onclick="showTaskModal('todoColumn')">
            <i class="bi bi-plus-lg"></i> Add new task
          </div>
        </div>

        <!-- In Progress -->
        <div
          class="column-section"
          id="progressColumn"
          ondragover="allowDrop(event)"
          ondrop="dropTask(event)"
        >
          <div class="column-title">
            <span class="status-indicator orange"></span> In Progress
            <span class="task-counter" id="progressTaskCount">0</span>
          </div>
          <div class="tasks-wrapper" id="progressTasksContainer"></div>
          <div class="empty-state" onclick="showTaskModal('progressColumn')">
            <i class="bi bi-plus-lg"></i> Add new task
          </div>
        </div>

        <!-- Completed -->
        <div
          class="column-section"
          id="doneColumn"
          ondragover="allowDrop(event)"
          ondrop="dropTask(event)"
        >
          <div class="column-title">
            <span class="status-indicator green"></span> Completed
            <span class="task-counter" id="doneTaskCount">0</span>
          </div>
          <div class="tasks-wrapper" id="doneTasksContainer"></div>
          <div class="empty-state" onclick="showTaskModal('doneColumn')">
            <i class="bi bi-plus-lg"></i> Add new task
          </div>
        </div>
      </div>
    </main>

    <!-- Task Modal -->
    <div class="modal fade" id="taskFormModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-body p-4">
            <h5 class="mb-4 fw-bold">Create New Task</h5>
            <input
              type="text"
              id="taskNameInput"
              class="form-control mb-3"
              placeholder="Task Title"
            />
            <textarea
              id="taskDescriptionInput"
              class="form-control mb-3"
              rows="3"
              placeholder="Description"
            ></textarea>
            <div class="row g-2 mb-4">
              <div class="col">
                <label class="small text-muted mb-1">Priority</label>
                <select id="taskPriorityInput" class="form-select">
                  <option value="High">High</option>
                  <option value="Medium" selected>Medium</option>
                  <option value="Low">Low</option>
                </select>
              </div>
            </div>
            <div class="d-flex justify-content-end gap-2">
              <button class="btn btn-light" data-bs-dismiss="modal">
                Cancel
              </button>
              <button class="btn btn-primary-custom" onclick="saveTask()">
                Save Task
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
